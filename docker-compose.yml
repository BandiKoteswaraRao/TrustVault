version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: trustvault-mysql
    restart: always
    environment:
      MYSQL_DATABASE: trustvault_db
      MYSQL_USER: trustvault_user
      MYSQL_PASSWORD: trustvault_secure_password_2026!
      MYSQL_ROOT_PASSWORD: trustvault_root_password_2026!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustvault-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/trustvault_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: trustvault_user
      SPRING_DATASOURCE_PASSWORD: trustvault_secure_password_2026!
      TRUSTVAULT_STORAGE_UPLOAD_DIR: /app/storage/uploads
    volumes:
      - document_storage:/app/storage/uploads

volumes:
  mysql_data:
  document_storage:
