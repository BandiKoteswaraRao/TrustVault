<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found — TrustVault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-[#050807] text-[#f0fdf4] min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full text-center">
        <h1 class="text-4xl font-extrabold text-emerald-400">404</h1>
        <h2 class="text-xl font-bold text-white mt-2">Resource Not Found</h2>
        <p class="text-xs text-gray-400 mt-2">The document or endpoint you requested does not exist in TrustVault.</p>

        <div class="mt-6">
            <a th:href="@{/dashboard}" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm transition-all inline-block">
                Back to Dashboard
            </a>
        </div>
    </div>

</body>
</html>
