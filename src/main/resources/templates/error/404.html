<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found — TrustVault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full text-center">
        <div class="inline-flex w-16 h-16 rounded-2xl bg-gray-900 border border-gray-800 p-1 mb-4 items-center justify-center">
            <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>

        <h1 class="text-3xl font-extrabold text-white">404</h1>
        <p class="text-xs uppercase tracking-widest text-cyan-400 font-bold mt-1">Resource Not Found</p>
        <p class="text-sm text-gray-400 mt-2">The requested document or resource was not found in the vault.</p>

        <div class="mt-6">
            <a th:href="@{/dashboard}"
               class="inline-block py-2.5 px-6 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs shadow-md shadow-blue-600/30 transition-all">
                Return to Dashboard
            </a>
        </div>
    </div>

</body>
</html>
