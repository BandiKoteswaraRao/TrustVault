<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title>Change Password — TrustVault</title>
</head>
<body>
<div th:fragment="content" class="space-y-6 max-w-xl mx-auto">

    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                Secure Password Change
            </h1>
            <p class="text-xs text-gray-400 mt-1">Re-hash and seal your credentials using BCrypt (cost factor 12)</p>
        </div>
        <a th:href="@{/profile}"
           class="px-3 py-1.5 rounded-lg bg-[#07110d] hover:bg-[#0f1c17] text-gray-300 text-xs border border-[#1a382d]">
            &larr; Back to Profile
        </a>
    </div>

    <!-- Password Form Card -->
    <div class="glass-panel p-6 sm:p-8 rounded-2xl border border-[#1a382d]">
        <form th:action="@{/profile/password}" th:object="${passwordDto}" method="post" class="space-y-5">
            <div>
                <label for="currentPassword" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Current Password</label>
                <input type="password" id="currentPassword" th:field="*{currentPassword}" required autofocus
                       placeholder="Enter current password"
                       class="w-full px-4 py-2.5 rounded-xl bg-[#07110d] border border-[#1a382d] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm text-gray-100 outline-none transition-all">
                <span th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="text-xs text-rose-400 mt-1 block"></span>
            </div>

            <div>
                <label for="newPassword" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">New Password</label>
                <input type="password" id="newPassword" th:field="*{newPassword}" required
                       placeholder="Minimum 8 characters"
                       class="w-full px-4 py-2.5 rounded-xl bg-[#07110d] border border-[#1a382d] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm text-gray-100 outline-none transition-all">
                <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="text-xs text-rose-400 mt-1 block"></span>
            </div>

            <div>
                <label for="confirmPassword" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Confirm New Password</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required
                       placeholder="Re-enter new password"
                       class="w-full px-4 py-2.5 rounded-xl bg-[#07110d] border border-[#1a382d] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm text-gray-100 outline-none transition-all">
                <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-xs text-rose-400 mt-1 block"></span>
            </div>

            <div class="pt-2 flex items-center justify-between">
                <button type="submit"
                        class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm shadow-lg shadow-emerald-950/40 transition-all hover:scale-[1.01]">
                    Update Password
                </button>
                <a th:href="@{/profile}" class="text-xs text-gray-400 hover:text-gray-200">Cancel</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
