<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title>Documents Vault — TrustVault</title>
</head>
<body>
<div th:fragment="content" class="space-y-6">

    <!-- Header & Action Row -->
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                Secure Document Vault
            </h1>
            <p class="text-xs text-gray-400 mt-1">
                Zero-Trust Document Repository with Server-Side Authorization &amp; IDOR Protection
            </p>
        </div>

        <div sec:authorize="hasAnyRole('ADMIN', 'OWNER')">
            <a th:href="@{/documents/upload}"
               class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm shadow-lg shadow-emerald-950/40 transition-all hover:scale-[1.02]">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Upload Document
            </a>
        </div>
    </div>

    <!-- Search & Filter Card -->
    <div class="glass-panel p-4 rounded-2xl border border-[#1a382d]">
        <form th:action="@{/documents}" method="get" class="flex flex-col md:flex-row gap-3">
            <div class="flex-grow">
                <input type="text" name="query" th:value="${query}"
                       placeholder="Search documents by title or description..."
                       class="w-full px-4 py-2 rounded-xl bg-[#07110d] border border-[#1a382d] text-sm text-gray-100 placeholder-gray-500 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none">
            </div>

            <div class="w-full md:w-56">
                <select name="category" onchange="this.form.submit()"
                        class="w-full px-3 py-2 rounded-xl bg-[#07110d] border border-[#1a382d] text-sm text-gray-100 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none">
                    <option value="" th:selected="${selectedCategory == null or selectedCategory == ''}">All Categories</option>
                    <option value="Financial" th:selected="${selectedCategory == 'Financial'}">Financial</option>
                    <option value="Legal" th:selected="${selectedCategory == 'Legal'}">Legal</option>
                    <option value="Confidential" th:selected="${selectedCategory == 'Confidential'}">Confidential</option>
                    <option value="Technical" th:selected="${selectedCategory == 'Technical'}">Technical</option>
                    <option value="Personal" th:selected="${selectedCategory == 'Personal'}">Personal</option>
                    <option value="General" th:selected="${selectedCategory == 'General'}">General</option>
                </select>
            </div>

            <div class="flex gap-2">
                <button type="submit"
                        class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium transition-colors">
                    Search
                </button>
                <a th:href="@{/documents}"
                   class="px-3 py-2 rounded-xl bg-[#07110d] hover:bg-[#12261f] text-gray-300 text-sm font-medium border border-[#1a382d] transition-colors">
                    Clear
                </a>
            </div>
        </form>
    </div>

    <!-- Documents Table -->
    <div class="glass-panel rounded-2xl border border-[#1a382d] p-6">
        <div th:if="${#lists.isEmpty(documents)}" class="text-center py-12 text-gray-400">
            <svg class="w-12 h-12 mx-auto text-gray-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <p class="text-sm font-medium">No documents match your query or filters.</p>
        </div>

        <div th:unless="${#lists.isEmpty(documents)}" class="overflow-x-auto">
            <table class="w-full text-left text-xs">
                <thead>
                    <tr class="border-b border-[#1a382d] text-gray-400 uppercase tracking-wider">
                        <th class="py-3 px-3">Title &amp; File</th>
                        <th class="py-3 px-3">Category</th>
                        <th class="py-3 px-3">Owner</th>
                        <th class="py-3 px-3">Content SHA-256</th>
                        <th class="py-3 px-3">Size</th>
                        <th class="py-3 px-3">Created</th>
                        <th class="py-3 px-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-[#1a382d]/70 text-gray-300">
                    <tr th:each="doc : ${documents}" class="hover:bg-[#0f2119]/40 transition-colors">
                        <td class="py-3.5 px-3">
                            <div>
                                <a th:href="@{'/documents/' + ${doc.id}}" class="font-bold text-sm text-emerald-400 hover:text-emerald-300" th:text="${doc.title}">Title</a>
                                <div class="text-[11px] text-gray-400 font-mono mt-0.5" th:text="${doc.originalFileName}">file.pdf</div>
                            </div>
                        </td>
                        <td class="py-3.5 px-3">
                            <span class="px-2.5 py-1 rounded-md text-[10px] font-semibold uppercase tracking-wider"
                                  th:classappend="${doc.category == 'Financial' ? 'bg-emerald-950/70 text-emerald-300 border border-emerald-800' :
                                                   doc.category == 'Legal' ? 'bg-amber-950/70 text-amber-300 border border-amber-800' :
                                                   doc.category == 'Confidential' ? 'bg-rose-950/70 text-rose-300 border border-rose-800' :
                                                   doc.category == 'Technical' ? 'bg-teal-950/70 text-teal-300 border border-teal-800' :
                                                   'bg-[#07110d] text-gray-300 border border-[#1a382d]'}"
                                  th:text="${doc.category}">Category</span>
                        </td>
                        <td class="py-3.5 px-3 font-medium text-gray-300" th:text="${doc.owner.fullName}"></td>
                        <td class="py-3.5 px-3">
                            <span class="hash-badge copy-hash" th:data-hash="${doc.fileHash}" th:text="${#strings.substring(doc.fileHash, 0, 16)} + '...'">hash</span>
                        </td>
                        <td class="py-3.5 px-3 font-mono text-gray-400" th:text="${#numbers.formatDecimal(doc.fileSize / 1024.0, 1, 1)} + ' KB'"></td>
                        <td class="py-3.5 px-3 font-mono text-gray-400" th:text="${#temporals.format(doc.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                        <td class="py-3.5 px-3 text-right space-x-1.5 whitespace-nowrap">
                            <a th:href="@{'/documents/' + ${doc.id}}" class="px-2.5 py-1 rounded-lg bg-[#07110d] hover:bg-[#12261f] text-gray-300 border border-[#1a382d] text-xs font-medium">Details</a>
                            <a th:href="@{'/documents/' + ${doc.id} + '/download'}" class="px-2.5 py-1 rounded-lg bg-emerald-600/90 hover:bg-emerald-600 text-white text-xs font-medium">Download</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
