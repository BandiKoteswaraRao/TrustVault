<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title>Upload Document — TrustVault</title>
</head>
<body>
<div th:fragment="content" class="space-y-6 max-w-2xl mx-auto">

    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                Secure Document Upload
            </h1>
            <p class="text-xs text-gray-400 mt-1">Files are hashed with SHA-256 and sealed into private storage</p>
        </div>
        <a th:href="@{/documents}"
           class="px-3 py-1.5 rounded-lg bg-[#07110d] hover:bg-[#0f1c17] text-gray-300 text-xs border border-[#1a382d]">
            &larr; Vault
        </a>
    </div>

    <!-- Upload Card -->
    <div class="glass-panel p-6 sm:p-8 rounded-2xl border border-[#1a382d]">
        <form th:action="@{/documents/upload}" th:object="${uploadDto}" method="post" enctype="multipart/form-data" class="space-y-5">
            <div>
                <label for="title" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Document Title</label>
                <input type="text" id="title" th:field="*{title}" required autofocus
                       placeholder="e.g. Q3 Financial Statement &amp; Balance Sheet"
                       class="w-full px-4 py-2.5 rounded-xl bg-[#07110d] border border-[#1a382d] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm text-gray-100 outline-none transition-all">
                <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-xs text-rose-400 mt-1 block"></span>
            </div>

            <div>
                <label for="category" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Category</label>
                <select id="category" th:field="*{category}"
                        class="w-full px-4 py-2.5 rounded-xl bg-[#07110d] border border-[#1a382d] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm text-gray-100 outline-none transition-all">
                    <option value="Financial">Financial</option>
                    <option value="Legal">Legal</option>
                    <option value="Confidential">Confidential</option>
                    <option value="Technical">Technical</option>
                    <option value="Personal">Personal</option>
                    <option value="General">General</option>
                </select>
            </div>

            <div>
                <label for="description" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Description (Optional)</label>
                <textarea id="description" th:field="*{description}" rows="3"
                          placeholder="Contextual summary or retention classification details..."
                          class="w-full px-4 py-2 rounded-xl bg-[#07110d] border border-[#1a382d] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm text-gray-100 outline-none transition-all"></textarea>
            </div>

            <!-- File Dropzone -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Select Document File</label>
                <div class="dropzone p-6 text-center cursor-pointer" onclick="document.getElementById('file').click()">
                    <svg class="w-10 h-10 mx-auto text-emerald-500/70 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <p class="text-xs text-gray-300 font-medium">Click to browse or drag file here</p>
                    <p class="text-[11px] text-gray-500 mt-1">Allowed: PDF, DOCX, XLSX, TXT, CSV, PNG, JPG (Max: 10MB)</p>
                    <p id="file-chosen-name" class="text-xs text-emerald-400 font-mono mt-2 font-semibold"></p>
                </div>
                <input type="file" id="file" th:field="*{file}" class="hidden"
                       onchange="document.getElementById('file-chosen-name').textContent = this.files[0] ? this.files[0].name + ' (' + (this.files[0].size/1024).toFixed(1) + ' KB)' : ''">
                <span th:if="${#fields.hasErrors('file')}" th:errors="*{file}" class="text-xs text-rose-400 mt-1 block"></span>
            </div>

            <div class="pt-3 flex items-center justify-between">
                <button type="submit"
                        class="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm shadow-lg shadow-emerald-950/40 transition-all hover:scale-[1.01]">
                    Encrypt &amp; Upload
                </button>
                <a th:href="@{/documents}" class="text-xs text-gray-400 hover:text-gray-200">Cancel</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
