<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account — TrustVault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z'/></svg>">
</head>
<body class="bg-[#050807] text-[#f0fdf4] min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-600 via-teal-600 to-emerald-400 p-0.5 shadow-xl shadow-emerald-500/20 mb-3">
                <div class="w-full h-full bg-[#050807] rounded-[14px] flex items-center justify-center">
                    <svg class="w-7 h-7 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                    </svg>
                </div>
            </div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 via-teal-300 to-green-300 bg-clip-text text-transparent">Create Account</h1>
            <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest font-semibold">Join TrustVault Zero-Trust Network</p>
        </div>

        <!-- Registration Card -->
        <div class="bg-[#0b1310] border border-[#1a382d] rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl">
            <form th:action="@{/register}" th:object="${userDto}" method="post" class="space-y-4">
                <div>
                    <label for="fullName" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Full Name</label>
                    <input type="text" id="fullName" th:field="*{fullName}" required autofocus
                           placeholder="e.g. John Doe"
                           class="w-full px-4 py-2.5 rounded-xl bg-[#07110d] border border-[#1a382d] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm text-gray-100 outline-none transition-all">
                    <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-xs text-rose-400 mt-1 block"></span>
                </div>

                <div>
                    <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Username</label>
                    <input type="text" id="username" th:field="*{username}" required
                           placeholder="e.g. jdoe"
                           class="w-full px-4 py-2.5 rounded-xl bg-[#07110d] border border-[#1a382d] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm text-gray-100 outline-none transition-all">
                    <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-xs text-rose-400 mt-1 block"></span>
                </div>

                <div>
                    <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Email Address</label>
                    <input type="email" id="email" th:field="*{email}" required
                           placeholder="e.g. jdoe@example.com"
                           class="w-full px-4 py-2.5 rounded-xl bg-[#07110d] border border-[#1a382d] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm text-gray-100 outline-none transition-all">
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-xs text-rose-400 mt-1 block"></span>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Password</label>
                    <input type="password" id="password" th:field="*{password}" required
                           placeholder="Minimum 8 characters"
                           class="w-full px-4 py-2.5 rounded-xl bg-[#07110d] border border-[#1a382d] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm text-gray-100 outline-none transition-all">
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-xs text-rose-400 mt-1 block"></span>
                </div>

                <div>
                    <label for="role" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Account Type</label>
                    <select id="role" th:field="*{role}"
                            class="w-full px-4 py-2.5 rounded-xl bg-[#07110d] border border-[#1a382d] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm text-gray-100 outline-none transition-all">
                        <option value="ROLE_OWNER">Document Owner (Author &amp; Share)</option>
                        <option value="ROLE_VIEWER">Compliance Viewer (View &amp; Verify)</option>
                    </select>
                </div>

                <button type="submit"
                        class="w-full mt-2 py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm shadow-lg shadow-emerald-950/40 transition-all hover:scale-[1.01]">
                    Register Vault Account
                </button>
            </form>

            <div class="mt-5 text-center">
                <span class="text-xs text-gray-400">Already registered? </span>
                <a th:href="@{/login}" class="text-xs font-semibold text-emerald-400 hover:text-emerald-300 underline">Sign in</a>
            </div>
        </div>
    </div>

</body>
</html>
