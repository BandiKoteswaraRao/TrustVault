<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — TrustVault: secure document sharing with a real audit trail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z'/></svg>">
</head>
<body class="bg-[#050807] text-[#f0fdf4] min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-600 via-teal-600 to-emerald-400 p-0.5 shadow-xl shadow-emerald-500/20 mb-3">
                <div class="w-full h-full bg-[#050807] rounded-[14px] flex items-center justify-center">
                    <svg class="w-7 h-7 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
            </div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 via-teal-300 to-green-300 bg-clip-text text-transparent">TrustVault</h1>
            <p class="text-xs text-emerald-400 mt-1 font-semibold tracking-wide">Secure document sharing with a real audit trail</p>
        </div>

        <!-- Login Card -->
        <div class="bg-[#0b1310] border border-[#1a382d] rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl">
            <!-- Alert Messages -->
            <div th:if="${param.error}" class="mb-5 p-3 rounded-xl bg-rose-950/60 border border-rose-500/50 text-rose-200 text-xs flex items-center gap-2">
                <svg class="w-4 h-4 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Invalid username or password. Please verify your credentials.</span>
            </div>

            <div th:if="${param.logout}" class="mb-5 p-3 rounded-xl bg-emerald-950/60 border border-emerald-500/50 text-emerald-200 text-xs flex items-center gap-2">
                <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>You have been signed out securely. Session invalidated.</span>
            </div>

            <div th:if="${successMessage}" class="mb-5 p-3 rounded-xl bg-emerald-950/60 border border-emerald-500/50 text-emerald-200 text-xs flex items-center gap-2">
                <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span th:text="${successMessage}">Success</span>
            </div>

            <form th:action="@{/login}" method="post" id="loginForm" class="space-y-4">
                <div>
                    <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Username or Email</label>
                    <input type="text" id="username" name="username" required autofocus
                           placeholder="e.g. admin@trustvault.local or admin"
                           class="w-full px-4 py-2.5 rounded-xl bg-[#07110d] border border-[#1a382d] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm text-gray-100 placeholder-gray-500 transition-all outline-none">
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Password</label>
                    <input type="password" id="password" name="password" required
                           placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
                           class="w-full px-4 py-2.5 rounded-xl bg-[#07110d] border border-[#1a382d] focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm text-gray-100 placeholder-gray-500 transition-all outline-none">
                </div>

                <button type="submit"
                        class="w-full mt-2 py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm shadow-lg shadow-emerald-950/40 transition-all hover:scale-[1.01] active:scale-[0.99]">
                    Authenticate &amp; Enter Vault
                </button>
            </form>

            <!-- 1-Click Quick Fill Demo Credentials -->
            <div class="mt-6 pt-5 border-t border-[#1a382d]">
                <span class="block text-[11px] font-bold uppercase tracking-wider text-emerald-400 text-center mb-2.5">
                    ⚡ 1-Click Evaluator Login Credentials
                </span>
                <div class="grid grid-cols-3 gap-2 text-xs">
                    <button type="button" onclick="fillAndSubmit('admin@trustvault.local', 'Admin@TrustVault2026!')"
                            class="p-2.5 rounded-xl bg-rose-950/70 hover:bg-rose-900 border border-rose-700/80 text-rose-200 font-semibold transition-all text-center hover:scale-105 block">
                        <span class="block font-bold text-sm">👑 Admin</span>
                        <span class="text-[10px] text-rose-300">Audit &amp; Users</span>
                    </button>
                    <button type="button" onclick="fillAndSubmit('owner@trustvault.local', 'Owner@TrustVault2026!')"
                            class="p-2.5 rounded-xl bg-emerald-950/70 hover:bg-emerald-900 border border-emerald-600/80 text-emerald-200 font-semibold transition-all text-center hover:scale-105 block">
                        <span class="block font-bold text-sm">📁 Alice</span>
                        <span class="text-[10px] text-emerald-300">Doc Owner</span>
                    </button>
                    <button type="button" onclick="fillAndSubmit('viewer@trustvault.local', 'Viewer@TrustVault2026!')"
                            class="p-2.5 rounded-xl bg-teal-950/70 hover:bg-teal-900 border border-teal-600/80 text-teal-200 font-semibold transition-all text-center hover:scale-105 block">
                        <span class="block font-bold text-sm">👁️ Bob</span>
                        <span class="text-[10px] text-teal-300">Viewer</span>
                    </button>
                </div>
            </div>

            <div class="mt-5 text-center">
                <span class="text-xs text-gray-400">Need a new test account? </span>
                <a th:href="@{/register}" class="text-xs font-semibold text-emerald-400 hover:text-emerald-300 underline">Register here</a>
            </div>
        </div>
    </div>

    <script>
        function fillAndSubmit(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
            document.getElementById('loginForm').submit();
        }
    </script>
</body>
</html>
