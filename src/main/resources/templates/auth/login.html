<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — TrustVault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-400 p-0.5 shadow-xl shadow-blue-500/20 mb-3">
                <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center">
                    <svg class="w-7 h-7 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
            </div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 via-cyan-300 to-indigo-300 bg-clip-text text-transparent">TrustVault</h1>
            <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest font-semibold">Secure Document Sharing &amp; Audit Trail</p>
        </div>

        <!-- Login Card -->
        <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl">
            <!-- Alert Messages -->
            <div th:if="${param.error}" class="mb-5 p-3 rounded-xl bg-rose-950/60 border border-rose-500/50 text-rose-200 text-xs flex items-center gap-2">
                <svg class="w-4 h-4 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Invalid username or password. Please verify credentials.</span>
            </div>

            <div th:if="${param.logout}" class="mb-5 p-3 rounded-xl bg-blue-950/60 border border-blue-500/50 text-blue-200 text-xs flex items-center gap-2">
                <svg class="w-4 h-4 text-blue-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>You have been signed out securely. Session invalidated.</span>
            </div>

            <div th:if="${successMessage}" class="mb-5 p-3 rounded-xl bg-emerald-950/60 border border-emerald-500/50 text-emerald-200 text-xs flex items-center gap-2">
                <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span th:text="${successMessage}">Success</span>
            </div>

            <form th:action="@{/login}" method="post" class="space-y-4">
                <div>
                    <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Username or Email</label>
                    <input type="text" id="username" name="username" required autofocus
                           placeholder="e.g. admin@trustvault.local or admin"
                           class="w-full px-4 py-2.5 rounded-xl bg-gray-950/80 border border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm text-gray-100 placeholder-gray-500 transition-all outline-none">
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Password</label>
                    <input type="password" id="password" name="password" required
                           placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
                           class="w-full px-4 py-2.5 rounded-xl bg-gray-950/80 border border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm text-gray-100 placeholder-gray-500 transition-all outline-none">
                </div>

                <button type="submit"
                        class="w-full mt-2 py-3 px-4 rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-500 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-sm shadow-lg shadow-blue-600/30 transition-all hover:scale-[1.01] active:scale-[0.99]">
                    Authenticate &amp; Enter Vault
                </button>
            </form>

            <!-- Quick Demo Accounts Switcher -->
            <div class="mt-6 pt-5 border-t border-gray-800">
                <span class="block text-[11px] font-bold uppercase tracking-wider text-gray-400 text-center mb-2.5">
                    1-Click Demo Accounts Quick-Fill
                </span>
                <div class="grid grid-cols-3 gap-2 text-xs">
                    <button type="button" onclick="fillCredentials('admin@trustvault.local', 'Admin@TrustVault2026!')"
                            class="p-2 rounded-lg bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/60 text-rose-300 font-medium transition-colors text-center">
                        <span class="block font-bold">Admin</span>
                        <span class="text-[10px] text-rose-400/80">Full Audit</span>
                    </button>
                    <button type="button" onclick="fillCredentials('owner@trustvault.local', 'Owner@TrustVault2026!')"
                            class="p-2 rounded-lg bg-blue-950/40 hover:bg-blue-900/60 border border-blue-800/60 text-blue-300 font-medium transition-colors text-center">
                        <span class="block font-bold">Doc Owner</span>
                        <span class="text-[10px] text-blue-400/80">Alice</span>
                    </button>
                    <button type="button" onclick="fillCredentials('viewer@trustvault.local', 'Viewer@TrustVault2026!')"
                            class="p-2 rounded-lg bg-emerald-950/40 hover:bg-emerald-900/60 border border-emerald-800/60 text-emerald-300 font-medium transition-colors text-center">
                        <span class="block font-bold">Viewer</span>
                        <span class="text-[10px] text-emerald-400/80">Bob</span>
                    </button>
                </div>
            </div>

            <div class="mt-5 text-center">
                <span class="text-xs text-gray-400">Need a new test account? </span>
                <a th:href="@{/register}" class="text-xs font-semibold text-cyan-400 hover:text-cyan-300 underline">Register here</a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
