# TrustVault Application Configuration
spring.application.name=TrustVault

# Default H2 In-Memory Database for development & test (MySQL mode)
spring.datasource.url=jdbc:h2:mem:trustvault_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

# Server Configuration (Render dynamically passes PORT env var)
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# File Storage Configuration (Local fallback)
trustvault.storage.upload-dir=${TRUSTVAULT_STORAGE_UPLOAD_DIR:storage/uploads}
trustvault.storage.max-file-size=10485760

# Supabase Storage Configuration (Optional Cloud Storage)
trustvault.supabase.url=${SUPABASE_URL:}
trustvault.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
trustvault.supabase.bucket=${SUPABASE_STORAGE_BUCKET:trustvault-documents}

# Multipart Upload Limits (10MB max file size, 12MB request size)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Management & Health Check Endpoints (for Render uptime monitoring)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
