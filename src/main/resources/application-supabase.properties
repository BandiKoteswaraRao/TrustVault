# =====================================================================
# TrustVault — Supabase Managed Cloud Profile
# Activate with: SPRING_PROFILES_ACTIVE=supabase
# =====================================================================

spring.datasource.url=${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=30000

# Secure Cookie Settings for Cloud Hosting
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
