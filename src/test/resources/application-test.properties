# Test Environment Configuration
spring.application.name=TrustVault-Test

# In-Memory H2 for Fast, Isolated Test Execution
spring.datasource.url=jdbc:h2:mem:trustvault_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Test Storage Directory
trustvault.storage.upload-dir=target/test-storage
trustvault.storage.max-file-size=10485760

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Fast BCrypt strength for lightning-fast test execution
trustvault.security.bcrypt-strength=4

spring.main.banner-mode=off
