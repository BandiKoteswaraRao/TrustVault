services:
  # Backend REST API
  - type: web
    name: trustvault-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: AUDIT_HMAC_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-postgres
          property: connectionString
      - key: CORS_ORIGIN
        value: https://trustvault-frontend.onrender.com
      - key: STORAGE_DIR
        value: storage/uploads
    healthCheckPath: /health

  # Frontend React Application
  - type: web
    name: trustvault-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: trustvault-backend
          property: host

databases:
  - name: trustvault-postgres
    databaseName: trustvault
    user: trustvault_user
    plan: free
